<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>팀 공유 자료</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#141b22;--ink2:#4a5661;--rule:#d5dce2;--accent:#2a5bd7;--err:#c43c2c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1418;--panel:#171e24;--ink:#e4e9ed;--ink2:#a7b2bb;--rule:#2c3740;--accent:#6b93f0;--err:#ef6a55;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
form{width:min(380px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font-size:20px}p{margin:0;color:var(--ink2);font-size:14px}
label{display:grid;gap:6px;font-size:14px;color:var(--ink2)}
input[type=password]{font:inherit;font-size:17px;letter-spacing:.04em;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:1.4em;font-size:13.5px;color:var(--err)}
</style></head><body>
<form id="f" autocomplete="off">
  <h1>팀 공유 자료</h1>
  <p>조원에게 받은 비밀번호를 입력하세요.</p>
  <label for="pw">비밀번호<input id="pw" type="password" required autofocus></label>
  <label class="row" for="keep"><input id="keep" type="checkbox">이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div id="msg" role="alert"></div>
</form>

  function u8(b){ var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  async function open(pw){
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(P.s), iterations:P.n, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
